[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "industrial-hazard-analysis"
version = "0.1.0"
description = "Reproducible multi-LLM semantic-channel topic analysis for industrial hazard text."
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "pandas>=2.0",
  "pyyaml>=6.0",
  "openpyxl>=3.1",
  "jsonschema>=3.2",
  "certifi>=2024.2.2",
]

[project.optional-dependencies]
clustering = [
  "umap-learn>=0.5.5",
  "hdbscan>=0.8.33",
  "scikit-learn>=1.3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"industrial_hazard_analysis.providers" = ["llm_output_schemas.json"]
